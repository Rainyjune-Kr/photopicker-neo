[package]
name = "photopicker-neo"
version = "0.1.0"
description = "Local photo selection for macOS and Windows"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "photopicker_neo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3"
jpeg-decoder = { version = "0.3.2", default-features = false }
jpeg-encoder = "0.7.1"
kamadak-exif = "0.6.2"
libopenraw = { version = "0.4.0-alpha.13", default-features = false }
open = "5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3.2"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tempfile = "3.27.0"
tokio = { version = "1", features = ["sync"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Imaging", "Win32_System_Com"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.dev.package.jpeg-decoder]
opt-level = 3

[profile.dev.package.jpeg-encoder]
opt-level = 3
